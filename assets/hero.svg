<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Christian Jay, software and systems builder, animated dashboard banner">
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07131a"/><stop offset="1" stop-color="#101c25"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#70f0c4"/><stop offset="1" stop-color="#47bacc"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a3b44" stroke-width="1" opacity=".55"/></pattern>
  <style>
   .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.sans{font-family:Arial,Helvetica,sans-serif}
   .ring{transform-origin:970px 190px;animation:spin 26s linear infinite}.ring2{transform-origin:970px 190px;animation:spin 19s linear infinite reverse}
   .blink{animation:blink 1.15s steps(1) infinite}.dash{stroke-dasharray:10 12;animation:dash 15s linear infinite}.rise{animation:rise 3s ease-in-out infinite alternate}.rise2{animation:rise 2.1s ease-in-out infinite alternate-reverse}
   .pulse{animation:pulse 2.8s ease-in-out infinite}.scan{animation:scan 7s linear infinite}
   @keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes dash{to{stroke-dashoffset:-220}}@keyframes rise{to{transform:translateY(-11px)}}@keyframes pulse{50%{opacity:.28}}@keyframes scan{from{transform:translateY(-120px)}to{transform:translateY(410px)}}
   @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <clipPath id="clip"><rect width="1200" height="390" rx="22"/></clipPath>
 </defs>
 <g clip-path="url(#clip)">
 <rect width="1200" height="390" fill="url(#bg)"/><rect width="1200" height="390" fill="url(#grid)" opacity=".55"/>
 <path d="M0 0H1200V54H0Z" fill="#0b1c24"/><path d="M0 54H1200" stroke="#21404b"/>
 <circle cx="33" cy="27" r="6" fill="#f78c77"/><circle cx="54" cy="27" r="6" fill="#f4cb71"/><circle cx="75" cy="27" r="6" fill="#76e6b6"/>
 <text x="111" y="32" class="mono" fill="#7f9fa5" font-size="14">~/workspace/christian-jay</text>
 <rect x="1022" y="15" width="145" height="24" rx="12" fill="#183b37" stroke="#34765e"/><circle cx="1040" cy="27" r="4" fill="#75efb1" class="pulse"/><text x="1052" y="31" class="mono" font-size="11" fill="#8cf1c7">SYSTEMS ONLINE</text>
 <text x="54" y="111" class="mono" font-size="16" fill="#70f0c4">// BUILDER PROFILE 001</text>
 <text x="50" y="186" class="sans" font-size="66" font-weight="bold" letter-spacing="-2" fill="#f1f8f6">Christian Jay<tspan class="blink" fill="#70f0c4">_</tspan></text>
 <text x="54" y="227" class="mono" font-size="18" fill="#bacfd0">I turn complex operations into intuitive software.</text>
 <rect x="54" y="262" width="494" height="1" fill="#2c4b51"/>
 <text x="54" y="295" class="mono" font-size="15" fill="#70f0c4">PRODUCT DESIGN</text><text x="211" y="295" class="mono" fill="#45646a">/</text><text x="234" y="295" class="mono" font-size="15" fill="#c4dcd8">SOFTWARE ENGINEERING</text>
 <text x="54" y="325" class="mono" font-size="15" fill="#70f0c4">WORKFLOW SYSTEMS</text><text x="225" y="325" class="mono" fill="#45646a">/</text><text x="248" y="325" class="mono" font-size="15" fill="#c4dcd8">AI-ASSISTED BUILDS</text>
 <text x="54" y="365" class="mono" font-size="12" fill="#78999d">github.com/aranacj</text>
 <circle cx="970" cy="190" r="149" fill="#103039" opacity=".28"/>
 <g class="ring"><circle cx="970" cy="190" r="127" fill="none" stroke="#38756c" stroke-width="1.3" stroke-dasharray="4 10"/><circle cx="1097" cy="190" r="7" fill="#70f0c4"/></g>
 <g class="ring2"><ellipse cx="970" cy="190" rx="103" ry="103" fill="none" stroke="#70f0c4" opacity=".62" stroke-dasharray="88 155" stroke-width="2"/><circle cx="867" cy="190" r="5" fill="#46bacc"/></g>
 <circle cx="970" cy="190" r="75" fill="#0e2730" stroke="#2f6668"/>
 <circle cx="970" cy="190" r="53" fill="#112f38" stroke="#70f0c4" opacity=".7"/>
 <path d="m947 176-15 14 15 14m46-28 15 14-15 14m-15-34-15 40" stroke="#85f4cf" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
 <g class="rise"><rect x="815" y="83" width="98" height="29" rx="7" fill="#14343b" stroke="#38746e"/><text x="828" y="102" fill="#a5eed9" font-size="11" class="mono">DESIGN ↗</text></g>
 <g class="rise2"><rect x="1050" y="277" width="112" height="29" rx="7" fill="#14343b" stroke="#38746e"/><text x="1063" y="296" fill="#a5eed9" font-size="11" class="mono">BUILD ↗</text></g>
 </g>
</svg>
