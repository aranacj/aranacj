<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Animated product workflow from discovery to delivery">
<defs><style>.t{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#d9eee9}.s{font-family:monospace;font-size:12px;fill:#80a9a5}.wire{stroke:#387b74;stroke-width:2;stroke-dasharray:8 10;animation:flow 2s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.node{fill:#122b32;stroke:#3b7f76;stroke-width:2}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1200" height="150" rx="16" fill="#0b1a22"/><path class="wire" d="M140 75H1060"/><g text-anchor="middle"><circle class="node" cx="150" cy="75" r="36"/><circle class="node" cx="450" cy="75" r="36"/><circle class="node" cx="750" cy="75" r="36"/><circle class="node" cx="1050" cy="75" r="36"/><text x="150" y="81" font-size="20" fill="#75efc3">01</text><text x="450" y="81" font-size="20" fill="#75efc3">02</text><text x="750" y="81" font-size="20" fill="#75efc3">03</text><text x="1050" y="81" font-size="20" fill="#75efc3">04</text><text x="150" y="31" class="t">DISCOVER</text><text x="450" y="31" class="t">DESIGN</text><text x="750" y="31" class="t">BUILD</text><text x="1050" y="31" class="t">VERIFY</text><text x="150" y="133" class="s">Map the problem</text><text x="450" y="133" class="s">Simplify the journey</text><text x="750" y="133" class="s">Engineer with intent</text><text x="1050" y="133" class="s">Test real workflows</text></g></svg>
